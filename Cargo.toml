[package]
name = "mc-quic-tunnel"
version = "0.3.0"
edition = "2021"
description = "Minecraft LAN tunnel — iroh QUIC, free public relays, no port forwarding"

[[bin]]
name = "mc-quic-tunnel"
path = "src/main.rs"

[dependencies]
iroh       = "0.98"
tokio      = { version = "1", features = ["full"] }
anyhow     = "1"